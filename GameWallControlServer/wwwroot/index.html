<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>GameWall Remote</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="setupBar" class="setup-bar">
    <label for="pcIpInput">Display PC address</label>
    <input id="pcIpInput" type="text" />
    <button id="pcIpSave">Reconnect</button>
    <span id="connState" class="conn-state conn-state--off">connecting…</span>
  </div>

  <header class="topbar">
    <h1 class="wordmark">GameWall</h1>

    <div class="layout-picker" id="layoutPicker">
      <button data-layout="1">1</button>
      <button data-layout="2">2</button>
      <button data-layout="4" class="active">4</button>
      <button data-layout="6">6</button>
      <button data-layout="8">8</button>
      <button data-layout="featured">Featured</button>
    </div>

    <button id="subscriptionsBtn" class="btn-secondary" title="Choose streaming subscriptions">Subscriptions</button>

    <label class="monitor-picker" for="monitorPicker">Display
      <select id="monitorPicker" disabled>
        <option>Connecting...</option>
      </select>
    </label>

    <div class="topbar-actions">
      <button id="testModeBtn" class="btn-secondary">Test mode</button>
      <button id="closeAllBtn" class="btn-danger">Close all</button>
    </div>
  </header>

  <div class="layout-root">

    <aside class="sidebar">
      <div class="sidebar-head">
        <span>This weekend</span>
        <span id="scheduleUpdated" class="sidebar-updated"></span>
      </div>
      <div id="scheduleWarning" class="schedule-warning" hidden></div>
      <div id="scheduleList" class="schedule-list">
        <p class="schedule-empty">Loading schedule…</p>
      </div>

      <details class="add-game">
        <summary>Add a game manually</summary>
        <div class="add-game-form">
          <input id="addGameLabel" type="text" placeholder="Team A @ Team B" />
          <input id="addGameUrl" type="text" placeholder="https://www.hulu.com/watch/..." />
          <button id="addGameBtn">Add to list</button>
        </div>
      </details>

      <p class="sidebar-hint">Tap a game, then tap a screen. Drag also works on desktop.</p>
    </aside>

    <main class="slot-grid" id="slotGrid">
      <!-- 8 slot cards injected by app.js -->
    </main>

  </div>

  <footer class="ticker" id="ticker">
    <div class="ticker-track" id="tickerTrack">Loading scores…</div>
  </footer>

  <div id="subscriptionsModal" class="modal-backdrop" hidden>
    <section class="subscriptions-modal" role="dialog" aria-modal="true" aria-labelledby="subscriptionsTitle">
      <div class="modal-head">
        <div>
          <p class="modal-kicker">Remote setup</p>
          <h2 id="subscriptionsTitle">Select your subscriptions</h2>
        </div>
        <button id="subscriptionsCloseBtn" class="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <p class="modal-copy">GameWall uses these choices to open each network's general live or watch page.</p>
      <div id="subscriptionsList" class="subscriptions-list"><p>Loading services...</p></div>
      <p id="subscriptionsError" class="modal-error" hidden></p>
      <div class="modal-actions">
        <button id="subscriptionsSkipBtn" class="btn-secondary" type="button">Skip for now</button>
        <button id="subscriptionsSaveBtn" class="btn-primary" type="button">Save subscriptions</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
